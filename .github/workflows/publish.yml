name: Publish to NuGet

# Publishes the package when you push a version tag like v0.1.0.
# Requires a repository secret named NUGET_API_KEY (nuget.org → API Keys).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 / 9 / 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Use the tag (v0.1.0 -> 0.1.0) or the manual input as the package version.
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test before publishing
        run: dotnet test tests/BlazorInspector.Tests/BlazorInspector.Tests.csproj --verbosity normal

      - name: Pack
        run: dotnet pack BlazorInspector/BlazorInspector.csproj -c Release -o artifacts -p:Version=${{ steps.ver.outputs.value }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
